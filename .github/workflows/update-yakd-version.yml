name: "update-yakd-version"
on:
  workflow_dispatch:
  schedule:
    # every Saturday at 1:00 Pacific/8:00 UTC
    - cron: "0 8 * * 6"
env:
  GOPROXY: https://proxy.golang.org
  GO_VERSION: '1.27.3'
permissions:
  contents: read

jobs:
  bump-yakd-version:
    if: github.event_name == 'workflow_dispatch' || vars.MAINTENANCE_PR_FORK != ''
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        timeout-minutes: 2
        with:
          go-version: ${{env.GO_VERSION}}
      - name: Bump yakd version
        timeout-minutes: 1
        id: bumpYakd
        run: |
          echo "OLD_VERSION=$(DEP=yakd make get-dependency-version)" >> "$GITHUB_OUTPUT"
          make update-yakd-version
          echo "NEW_VERSION=$(DEP=yakd make get-dependency-version)" >> "$GITHUB_OUTPUT"
          # The following is to support multiline with GITHUB_OUTPUT, see https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$(git status --porcelain)" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create PR
        timeout-minutes: 1
        if: ${{ steps.bumpYakd.outputs.changes != '' }}
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          token: ${{ vars.MAINTENANCE_PR_FORK != '' && (secrets.MINIKUBE_BOT_PAT || 'missing minikube bot pat') || github.token }}
          commit-message: 'Addon yakd: Update manusa/yakd image from ${{ steps.bumpYakd.outputs.OLD_VERSION }} to ${{ steps.bumpYakd.outputs.NEW_VERSION }}'
          committer: ${{ vars.MAINTENANCE_PR_FORK != '' && 'minikube-bot <20374350+minikube-bot@users.noreply.github.com>' || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}
          author: ${{ vars.MAINTENANCE_PR_FORK != '' && 'minikube-bot <20374350+minikube-bot@users.noreply.github.com>' || format('{0} <{1}+{0}@users.noreply.github.com>', github.actor, github.actor_id) }}
          branch: auto_bump_yakd_version
          push-to-fork: ${{ vars.MAINTENANCE_PR_FORK }}
          base: ${{ vars.MAINTENANCE_PR_FORK != '' && github.event.repository.default_branch || github.ref_name }}
          delete-branch: true
          title: 'Addon yakd: Update manusa/yakd image from ${{ steps.bumpYakd.outputs.OLD_VERSION }} to ${{ steps.bumpYakd.outputs.NEW_VERSION }}'
          labels: ${{ vars.MAINTENANCE_PR_FORK != '' && 'ok-to-test' || '' }}
          body: |
            The [yakd](https://github.com/manusa/yakd) project released a new yakd image

            This PR was auto-generated by `make update-yakd-version` in [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
